root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/main.go"
  bin = "tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "static"]

[log]
  time = false

[misc]
  clean_on_exit = true

[server]
  graceful_timeout = 5  # Время для graceful shutdown  